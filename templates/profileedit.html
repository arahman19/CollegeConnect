{% extends 'template.html' %}
{% block body %}
    <header style="text-align: center; font-size: 3rem; color: #222222;">This is the profile Edit page</header>
    <!--<body style="align-self: left;"><img src="../Static/Images/placeholderPfp.jpg" alt="custom profile" id="custom-pfp-img" width="200" height="200"></body>-->
    <!--Pretend to the profile picture stuff is up here-->
    <div class="profile-edit" style="color: black;">
        <form method="post" action="/edit" class="default-form" style="margin-left: 25%; margin-right: 25%;">
            <h1>Edit Profile</h1>
            <div class="form-field">
                <label for="picture">Select a Profile Picture:</label>
                <input type="file" accept=".jpg,.png,.jpeg" id="myFile" name="filename">
            </div>
            <div class="form-field">
                <label for="gender">Gender:</label>
                <select name="gender" id="gender">
                    <option value="999">N/A</option>
                    <option value="0">Male</option>
                    <option value="1">Female</option>
                    <option value="999">Other</option>
                    <option value="999">Prefer not to say</option>
                  </select>
            </div>
            <div class="form-field">
                <label for="grade">Grade Level:</label>
                <select name="grade" id="grade">
                    <option value="999">N/A</option>
                    <option value="0">Freshman</option>
                    <option value="1">Sophmore</option>
                    <option value="2">Junior</option>
                    <option value="3">Senior</option>
                  </select>
            </div>
            <div class="form-field">
                <label for="religion">Relgion:</label>
                <select name="religion" id="religion">
                    <option value="999">N/A</option>
                    <option value="0">Agnosticism</option>
                    <option value="1">Atheistism</option>
                    <option value="2">Christianity</option>
                    <option value="3">Judaism</option>
                    <option value="4">Islam</option>
                    <option value="5">Buddhism</option>
                    <option value="6">Hinduism</option>
                  </select>
            </div>
            <div class="form-field">
                <label for="drugs">Do you use recreational drugs?</label>
                <select name="drugs" id="drugs">
                    <option value="999">N/A</option>
                    <option value="0">Yes</option>
                    <option value="1">No</option>
                  </select>
            </div>
            <div class="form-field">
                <label for="neatness">How would you rate your neatness on a scale of 1 (messy) to 5 (neat-freak)?</label>
                <select name="neatness" id="neatness">
                    <option value="999">N/A</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                  </select>
            </div>
            <div class="form-field">
                <label for="chrono">What is your Chronotype?</label>
                <select name="chrono" id="chrono">
                    <option value="999">N/A</option>
                    <option value="0">Early Bird</option>
                    <option value="1">Night Owl</option>
                    <option value="999">No Preference</option>
                  </select>
            </div>
            <p><label for="aboutMe">About Me:</label></p>
            <textarea id="aboutMe" name="aboutMe" rows="6" cols="100">About Me...</textarea>
            <br>
            <br>
            <button>Submit</button>
        </form>
    </div>
{% endblock %}
