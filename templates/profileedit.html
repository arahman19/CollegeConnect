{% extends 'template.html' %}
{% block body %}
    <header style="text-align: center; font-size: 3rem; color: #222222;">This is the profile Edit page</header>
    <!--<body style="align-self: left;"><img src="../Static/Images/placeholderPfp.jpg" alt="custom profile" id="custom-pfp-img" width="200" height="200"></body>-->
    <!--Pretend to the profile picture stuff is up here-->
    <div class="login" style="color: black;">
        <form action="/profile" class="default-form" style="margin-left: 25%; margin-right: 25%;">
            <h1>Edit Profile</h1>
            <div class="form-field">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="name" placeholder="John Smith" class="form-text">
            </div>
            <div class="form-field">
                <label for="birthday" class="form-label">Birthday</label>
                <input type="date" name="birthday">
            </div>
            <button>Submit</button>
        </form>
    </div>
{% endblock %}
