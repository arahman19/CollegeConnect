<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts in Thread</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Posts in "{{ thread.title }}"</h1>
        <ul class="list-group mb-3">
            {% for post in thread.posts %}
            <li class="list-group-item">
                <strong>{{ post.account.username }}</strong> at {{ post.posted_on.strftime('%Y-%m-%d %H:%M:%S') }}
                <p>{{ post.content }}</p>
            </li>
            {% endfor %}
        </ul>

        <form action="{{ url_for('posts', thread_id=thread.id) }}" method="post">
            <div class="mb-3">
                <label for="content" class="form-label">New Post</label>
                <textarea class="form-control" id="content" name="content" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit Post</button>
        </form>
    </div>
</body>
</html>
