{% extends 'template.html' %}
{% block head %}
    <link rel="stylesheet" type="text/css" href="../Static/CSS/profile.css">
{% endblock %}
{% block body %}
    <main>
        <div class="profile-layout">
            <div class="profile-info">
                <a href="/edit_profile"><button class="edit-profile-button button button-primary">Edit Profile</button></a>
                <figure>
                    <div class="profile-pfp-container">
                        <!--Should display placeholder if not logged in or user has no pfp set-->
                        <img src="../Static/Images/placeholderPfp.jpg" alt="custom profile" id="custom-pfp-img">
                    </div>
                    <figcaption class="profile-name"><strong>{{current_user.username}}</strong></figcaption>
                </figure>
                <a href="/logout"><button class="logout-button">Logout</button></a>
                <a href="/profileedit"><button class="logout-button">Settings</button></a>
            </div>
            <div class="profile-listings">
                <h4>Your Settings</h4>
                <div>
                    <!--TO DO display users preferences as they are set here-->
                </div>
            </div>
        </div>
    </main>
{% endblock %}
